<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SSTP Terengganu</title>
    <meta name="description" content="Laman rasmi SSTP Terengganu.">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #162033;
        background: #f6f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(760px, 100%);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #0f7a67;
        font-size: 0.86rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 5.4rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        max-width: 56ch;
        margin: 24px 0 0;
        color: #46556d;
        font-size: 1.12rem;
        line-height: 1.7;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        padding: 12px 16px;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        background: #ffffff;
        color: #26354c;
        font-weight: 650;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #16a36d;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">GitHub Pages</p>
      <h1>SSTP Terengganu</h1>
      <p>Laman ini sedang disambungkan ke domain rasmi. Kandungan penuh boleh ditambah selepas setup domain dan hosting selesai.</p>
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        Domain setup in progress
      </div>
    </main>
  </body>
</html>
