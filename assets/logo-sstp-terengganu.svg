<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-labelledby="title desc">
  <title id="title">SSTP Terengganu</title>
  <desc id="desc">Logo digital SSTP Terengganu dengan gaya metalik dan litar neon.</desc>
  <defs>
    <linearGradient id="metal" x1="92" y1="58" x2="402" y2="166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#d7e0ea"/>
      <stop offset="0.54" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#95a4b7"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="188" y1="36" x2="456" y2="166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7ff7ff"/>
      <stop offset="0.48" stop-color="#25d5e8"/>
      <stop offset="1" stop-color="#0898c8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#00040a" flood-opacity="0.58"/>
    </filter>
  </defs>

  <path d="M66 123C128 48 322 22 457 74" fill="none" stroke="#eaf6ff" stroke-width="11" stroke-linecap="round" opacity="0.82"/>
  <path d="M55 144c94 43 272 50 411-30" fill="none" stroke="url(#cyan)" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M67 141c101 31 259 33 381-32" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.78"/>

  <g filter="url(#shadow)">
    <text x="260" y="152" text-anchor="middle" font-family="Arial Black, Inter, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-6" stroke="#06101b" stroke-width="10" paint-order="stroke fill" fill="url(#metal)">SSTP</text>
    <text x="260" y="152" text-anchor="middle" font-family="Arial Black, Inter, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-6" fill="url(#metal)">SSTP</text>
  </g>

  <g fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M236 51V27h24"/>
    <path d="M266 51V18h37"/>
    <path d="M296 51V30h28"/>
    <path d="M352 50h46"/>
    <path d="M367 116h67v20h35"/>
  </g>

  <g fill="#7ff7ff" filter="url(#glow)">
    <circle cx="260" cy="27" r="7"/>
    <circle cx="303" cy="18" r="7"/>
    <circle cx="324" cy="30" r="7"/>
    <circle cx="398" cy="50" r="6"/>
    <circle cx="469" cy="136" r="6"/>
  </g>

  <rect x="151" y="174" width="218" height="3" rx="1.5" fill="url(#cyan)" opacity="0.9"/>
  <text x="260" y="203" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="7" fill="#eaf7fb">TERENGGANU</text>
</svg>
