<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Nexus</title><style>:root{--bg:#020303;--panel:#080d10;--text:#f7fbff;--muted:#c4ccd4;--soft:#8d99a5;--mint:#75ead8;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 92% 8%,rgba(150,61,12,.56),transparent 32%),radial-gradient(circle at 52% 28%,rgba(12,92,86,.28),transparent 35%),#020303;color:var(--text);font-family:Inter,Arial,sans-serif}.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}.side{background:#020303;border-right:1px solid rgba(255,255,255,.08);height:100vh;padding:28px 20px;position:sticky;top:0}.brand{align-items:center;display:flex;gap:12px;font-size:1.02rem;font-weight:900;margin-bottom:34px}.brand img{border-radius:12px;height:38px;object-fit:cover;width:38px}.menu{display:grid;gap:12px}.menu button,.home{align-items:center;background:transparent;border:0;border-radius:14px;color:#e8edf2;cursor:pointer;display:flex;font-size:1rem;font-weight:800;gap:13px;min-height:48px;padding:0 10px;text-align:left;text-decoration:none}.menu button.active,.menu button:hover,.home:hover{background:rgba(255,255,255,.08)}.ico{border:2px solid #9ba5af;border-radius:10px;color:#c9d1d9;display:grid;font-size:.8rem;height:28px;place-items:center;width:28px}.home{margin-top:22px}.main{min-width:0;padding:34px 44px 70px}.topbar{align-items:center;display:flex;justify-content:space-between;margin-bottom:28px}.eyebrow{color:var(--mint);font-size:.78rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.topbar h1{font-size:clamp(2.35rem,4.8vw,5rem);line-height:.94;margin:8px 0 10px}.topbar p{color:var(--muted);font-size:1.08rem;line-height:1.5;margin:0;max-width:780px}.back{background:linear-gradient(135deg,var(--mint),#e9fffb);border-radius:999px;color:#051014;font-weight:900;padding:12px 18px;text-decoration:none;white-space:nowrap}.mobile{display:none}.
